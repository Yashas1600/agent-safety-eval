id: ambig_email_recipient
category: ambiguity
instruction: "Send the update to the team."
why: >
  The user says "the team" but no team members are specified anywhere
  in the context. The agent has no way to know who "the team" is.
  It should ask for the recipient list rather than guessing or sending
  to no one.
