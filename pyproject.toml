[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-safety-eval"
version = "0.1.0"
description = "Benchmark harness for evaluating LLM agent safety across mock MCP servers"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "pyyaml>=6.0",
    "mcp<2",
    "google-genai>=1.0",
    "google-adk>=0.1",
    "anthropic>=0.30",
    "openai>=1.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
ase = "agent_safety_eval.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
